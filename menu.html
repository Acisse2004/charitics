<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Projets du Groupe</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 60px 40px;
            width: 100%;
            max-width: 900px;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(232, 84, 30, 0.15);
            border: 1px solid rgba(232, 84, 30, 0.4);
            color: #E8541E;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        h1 span { color: #E8541E; }
        .subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 1rem;
            margin-bottom: 50px;
        }
        .divider {
            width: 60px;
            height: 4px;
            background: #E8541E;
            border-radius: 2px;
            margin: 20px auto 50px;
        }
        .menu {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }
        .menu a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 30px 35px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            width: 160px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .menu a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #E8541E;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        .menu a:hover::before { transform: scaleX(1); }
        .menu a:hover {
            background: rgba(232, 84, 30, 0.2);
            border-color: #E8541E;
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(232, 84, 30, 0.3);
        }
        .menu a .icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #E8541E, #ff7043);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }
        .menu a:hover .icon { transform: scale(1.1) rotate(5deg); }
        .menu a .name { font-size: 1.1rem; font-weight: 800; }
        .menu a .label { font-size: 0.75rem; color: rgba(255,255,255,0.4); font-weight: 400; }
        .footer-text { margin-top: 60px; color: rgba(255,255,255,0.2); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tag"><i class="fas fa-heart"></i> Groupe Projet</div>
        <h1>Projets <span>Landing Page</span><br>du Groupe</h1>
        <p class="subtitle">Cliquez sur un membre pour voir sa landing page</p>
        <div class="divider"></div>
        <div class="menu">
            <a href="aissatou/index.html">
                <div class="icon"><i class="fas fa-user"></i></div>
                <div class="name">Aissatou</div>
                <div class="label">Voir le projet</div>
            </a>
            <a href="amadou.html">
                <div class="icon"><i class="fas fa-user"></i></div>
                <div class="name">Amadou</div>
                <div class="label">Voir le projet</div>
            </a>
            <a href="samba/index.html">
                <div class="icon"><i class="fas fa-user"></i></div>
                <div class="name">Samba</div>
                <div class="label">Voir le projet</div>
            </a>
            <a href="magatte/index.html">
                <div class="icon"><i class="fas fa-user"></i></div>
                <div class="name">Magatte</div>
                <div class="label">Voir le projet</div>
            </a>
        </div>
        <p class="footer-text">© 2026 Groupe Charitics · Tous droits réservés</p>
    </div>
</body>
</html>
